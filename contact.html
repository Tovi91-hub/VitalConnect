<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | VitalConnect</title>
  <meta name="description" content="VitalConnect is a community wellness platform for mood tracking, prayer support, shared resources, and practical help, built as a Purdue Global IT499 capstone.">
  <meta name="theme-color" content="#0f4c81">
  <meta property="og:title" content="Contact | VitalConnect">
  <meta property="og:description" content="VitalConnect is a community wellness platform for mood tracking, prayer support, shared resources, and practical help, built as a Purdue Global IT499 capstone.">
  <meta property="og:type" content="website">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Applies the saved theme before the first paint, so the page never
       flashes the light palette on its way to dark. */
    (function () {
      try {
        var stored = localStorage.getItem('vc_theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'dark' || stored === 'light' ? stored : (dark ? 'dark' : 'light')
        );
      } catch (error) { /* Storage blocked; the light default applies. */ }
    })();
  </script>
</head>
<body>
  <div id="app-header"></div>
  <main id="main-content">
    <noscript>
      <div class="container" style="padding:24px 0">
        <div class="notice warning">
          VitalConnect stores your account and posts in your own browser, so it needs
          JavaScript enabled. Please turn it on and reload this page.
        </div>
      </div>
    </noscript>

    <section class="page-header">
      <div class="container center">
        <h1>Contact</h1>
        <p class="lead" style="margin-inline:auto">
          Questions about the project, or feedback on the site? Send a note.
        </p>
      </div>
    </section>

    <section class="container">
      <div class="card form-card">
        <div class="notice info">
          This form demonstrates front-end validation and usability. On static hosting
          there is no mail server, so submissions are acknowledged here rather than
          delivered.
        </div>
        <div id="contactFeedback"></div>
        <form id="contactForm" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="name">Name</label>
              <input id="name" name="name" required autocomplete="name">
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required maxlength="1000"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">Send message</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
  <script>
    /* Registered on DOMContentLoaded, which fires after the deferred app.js has
       booted, so VitalConnect is available. Replaces the inline onsubmit
       attribute the previous version used. */
    document.addEventListener('DOMContentLoaded', function () {
      var form = document.querySelector('#contactForm');
      if (!form) return;

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        document.querySelector('#contactFeedback').innerHTML = VitalConnect.createNotice(
          'Thank you. Your message has been captured for demonstration purposes.',
          'success'
        );
        VitalConnect.toast('Message received.', 'success');
        form.reset();
      });
    });
  </script>
</body>
</html>
