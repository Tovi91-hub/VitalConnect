<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-labelledby="title desc">
<title>VitalConnect Logo</title>
<desc>VitalConnect professional logo with linked circles and heartbeat line.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f4c81"/>
    <stop offset="100%" stop-color="#c9a227"/>
  </linearGradient>
</defs>
<rect width="420" height="120" rx="18" fill="#ffffff"/>
