<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | VitalConnect</title>
  <meta name="description" content="VitalConnect is a community wellness platform for mood tracking, prayer support, shared resources, and practical help, built as a Purdue Global IT499 capstone.">
  <meta name="theme-color" content="#0f4c81">
  <meta property="og:title" content="Login | VitalConnect">
  <meta property="og:description" content="VitalConnect is a community wellness platform for mood tracking, prayer support, shared resources, and practical help, built as a Purdue Global IT499 capstone.">
  <meta property="og:type" content="website">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Applies the saved theme before the first paint, so the page never
       flashes the light palette on its way to dark. */
    (function () {
      try {
        var stored = localStorage.getItem('vc_theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'dark' || stored === 'light' ? stored : (dark ? 'dark' : 'light')
        );
      } catch (error) { /* Storage blocked; the light default applies. */ }
    })();
  </script>
</head>
<body>
  <div id="app-header"></div>
  <main id="main-content">
    <noscript>
      <div class="container" style="padding:24px 0">
        <div class="notice warning">
          VitalConnect stores your account and posts in your own browser, so it needs
          JavaScript enabled. Please turn it on and reload this page.
        </div>
      </div>
    </noscript>

    <section class="page-header">
      <div class="container center">
        <h1>Welcome back</h1>
        <p class="lead" style="margin-inline:auto">Sign in to reach your dashboard.</p>
      </div>
    </section>

    <section class="container">
      <div class="card form-card">
        <div id="demoNotice"></div>
        <div id="formFeedback"></div>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">Sign in</button>
            <a class="btn-ghost" href="register.html">Create an account</a>
          </div>
        </form>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
  <script src="auth.js" defer></script>
</body>
</html>
