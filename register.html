<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | VitalConnect</title>
  <meta name="description" content="VitalConnect community wellness platform for Purdue Global IT499 capstone deployment.">
  <link rel="icon" href="logo.svg" type="svg+xml">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div id="app-header"></div>
  <main id="main-content"><section class="page-header"><div class="container center"><h1>Create Your Account</h1><p class="lead" style="margin-inline:auto">Register to access the full VitalConnect community experience.</p></div></section><section class="container"><div class="card form-card"><div id="formFeedback"></div><form id="registerForm"><div class="form-row"><div class="form-group"><label for="name">Full Name</label><input id="name" name="name" required></div><div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div></div><div class="form-row"><div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" required></div><div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" name="confirmPassword" type="password" required></div></div><div class="form-row"><div class="form-group"><label for="city">City</label><input id="city" name="city" required></div><div class="form-group"><label for="state">State</label><input id="state" name="state" required></div></div><div class="form-group"><label for="bio">Short Bio</label><textarea id="bio" name="bio" placeholder="Share a short introduction."></textarea></div><div class="form-actions"><button class="btn" type="submit">Register</button><a class="btn-ghost" href="login.html">Already have an account?</a></div></form></div></section></main>
  <div id="app-footer"></div>
  <script src="app.js" defer></script>
  <script src="auth.js" defer></script>
</body>
</html>
